<!doctype html>
<!-- Google Play's feature graphic, 1024×500: captured to feature-graphic.png by scripts/store-capture.mjs. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Atom Trap: Neon feature graphic</title>
    <style>
      @font-face {
        font-family: 'Chakra Petch';
        font-weight: 700;
        src: url('../node_modules/@fontsource/chakra-petch/files/chakra-petch-latin-700-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Chakra Petch';
        font-weight: 500;
        src: url('../node_modules/@fontsource/chakra-petch/files/chakra-petch-latin-500-normal.woff2') format('woff2');
      }
      html,
      body {
        margin: 0;
        width: 1024px;
        height: 500px;
        overflow: hidden;
        background: #05060f;
      }
      svg {
        position: absolute;
        inset: 0;
      }
      .title {
        position: absolute;
        left: 60px;
        top: 142px;
        font-family: 'Chakra Petch', sans-serif;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: 84px;
        line-height: 0.95;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: #3ee8ff;
        text-shadow: 0 0 28px rgba(62, 232, 255, 0.55);
      }
      h1 span {
        display: block;
        color: #ff40c8;
        text-shadow: 0 0 28px rgba(255, 64, 200, 0.6);
      }
      p {
        margin: 22px 0 0;
        font-size: 22px;
        font-weight: 500;
        letter-spacing: 0.16em;
        color: rgba(207, 233, 255, 0.8);
      }
    </style>
  </head>
  <body>
    <svg width="1024" height="500" viewBox="0 0 1024 500">
      <defs>
        <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
          <path d="M24 0H0V24" fill="none" stroke="#121a38" stroke-width="1.5" />
        </pattern>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="6" result="b" />
          <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
        <radialGradient id="atom">
          <stop offset="0" stop-color="#fff" />
          <stop offset="0.35" stop-color="#ff8ae0" />
          <stop offset="1" stop-color="#ff40c8" />
        </radialGradient>
        <linearGradient id="fade" x1="0" x2="1">
          <stop offset="0.2" stop-color="#05060f" />
          <stop offset="0.6" stop-color="#0a1230" />
        </linearGradient>
      </defs>
      <!-- The chamber, in its own 500×380 frame: filled-in areas, a grid, walls, a growing wall, atoms. -->
      <rect x="0" y="0" width="1024" height="500" fill="url(#fade)" />
      <g transform="translate(570 88) scale(0.85)">
        <rect width="500" height="380" fill="#080b1d" />
        <rect width="500" height="380" fill="url(#grid)" />
        <rect x="360" width="140" height="160" fill="#12306a" opacity="0.8" />
        <rect y="264" width="168" height="116" fill="#12306a" opacity="0.8" />
        <g fill="none" stroke="#3ee8ff" stroke-width="5" filter="url(#glow)">
          <rect width="500" height="380" />
          <path d="M360 0V160H500" />
          <path d="M0 264H168V380" />
          <path d="M264 380V208" />
        </g>
        <path d="M264 208V140" stroke="#ff40c8" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
        <g filter="url(#glow)">
          <circle cx="86" cy="184" r="15" fill="url(#atom)" />
          <circle cx="132" cy="80" r="15" fill="url(#atom)" />
          <circle cx="210" cy="116" r="15" fill="url(#atom)" />
          <circle cx="412" cy="270" r="15" fill="url(#atom)" />
          <circle cx="320" cy="68" r="15" fill="url(#atom)" />
        </g>
        <g stroke="#ff40c8" stroke-width="3" opacity="0.35" stroke-linecap="round">
          <path d="M118 66l-22 -22" />
          <path d="M224 130l22 22" />
          <path d="M398 284l-22 22" />
        </g>
      </g>
          </svg>
    <div class="title">
      <h1>Atom Trap<span>Neon</span></h1>
      <p>Build walls. Trap atoms.</p>
    </div>
  </body>
</html>
