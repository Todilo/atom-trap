<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#05060f" />
    <meta name="description" content="Atom Trap: a neon tribute to JezzBall (1992)" />
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>Atom Trap</title>
  </head>
  <body>
    <header id="hud" aria-live="off">
      <span>Lives <b id="hud-lives">0</b></span>
      <span>Cleared <b id="hud-coverage">0%</b></span>
      <span>Score <b id="hud-score">0</b></span>
      <span>Time <b id="hud-time">0</b></span>
    </header>
    <main id="app"></main>
    <div id="message" hidden></div>
    <div id="rotate" role="alert">
      <p>Rotate your device to landscape</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
