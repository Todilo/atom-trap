<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#05060f" />
    <meta name="description" content="Atom Trap: a neon tribute to JezzBall (1992)" />
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>Atom Trap</title>
  </head>
  <body>
    <!-- The whole game lives in #stage, which is drawn turned 90° when the screen is portrait (ADR-0013). -->
    <div id="stage">
      <header id="hud" aria-live="off">
        <div class="chip">
          <span class="mode-tag" id="hud-mode">Classic</span>
          <span class="lbl">Level</span><b class="big" id="hud-level">1</b>
        </div>
        <div class="chip">
          <span class="lbl">Lives</span><span class="dots" id="hud-dots" aria-hidden="true"></span><b id="hud-lives">0</b>
        </div>
        <div class="chip grow col">
          <div class="line"><span class="lbl">Cleared</span><span><b id="hud-coverage">0%</b> <span class="dim" id="hud-target">/ 75%</span></span></div>
          <div class="bar"><div class="fill" id="hud-coverage-bar"></div><div class="mark" id="hud-target-mark"></div></div>
        </div>
        <div class="chip col end">
          <span class="lbl"><span id="hud-score-label">Score</span><i id="hud-unscored" hidden> · unscored</i></span>
          <span class="value-row"><span id="hud-stars"></span><b class="score" id="hud-score">0</b></span>
        </div>
        <div class="chip col time" id="hud-time-chip">
          <div class="line"><span class="lbl">Time</span><b id="hud-time">0</b></div>
          <div class="bar thin"><div class="fill" id="hud-time-bar"></div></div>
        </div>
        <button type="button" id="hud-pause" aria-label="Pause">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1" /><rect x="14" y="4" width="4" height="16" rx="1" /></svg>
        </button>
      </header>
      <main id="app"></main>
      <div id="hint" hidden>
        <!-- Touch: a finger touches and swipes. Mouse: a pointer clicks and a vertical wall grows both ways. -->
        <div class="demo touch-demo"><span class="finger"></span><span class="beam"></span></div>
        <div class="demo mouse-demo">
          <span class="vbeam"></span>
          <span class="ripple"></span>
          <svg class="pointer" viewBox="0 0 16 24" aria-hidden="true"><path d="M1 1 L1 19 L5.5 14.5 L8.5 22 L11.5 20.8 L8.6 13.4 L14.5 13.4 Z" /></svg>
        </div>
        <p id="hint-text"></p>
      </div>
      <section id="screen" hidden></section>
      <div id="update" role="status" hidden>
        <span>A new version of Atom Trap is ready.</span>
        <button type="button" data-action="update" class="primary">Reload</button>
        <button type="button" data-action="later">Later</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
