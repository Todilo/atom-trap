<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#05060f" />
    <meta name="description" content="Atom Trap: a neon tribute to JezzBall (1992)" />
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>Atom Trap</title>
  </head>
  <body>
    <!-- The whole game lives in #stage, which is drawn turned 90° when the screen is portrait (ADR-0013). -->
    <div id="stage">
      <header id="hud" aria-live="off">
        <span>Level <b id="hud-level">1</b></span>
        <span>Lives <b id="hud-lives">0</b></span>
        <span>Cleared <b id="hud-coverage">0%</b></span>
        <span>Score <b id="hud-score">0</b><i id="hud-unscored" hidden> unscored</i></span>
        <span>Time <b id="hud-time">0</b></span>
        <button type="button" id="hud-pause" aria-label="Pause">❚❚</button>
      </header>
      <main id="app"></main>
      <div id="hint" hidden>
        <div class="demo"><span class="finger"></span><span class="beam"></span></div>
        <p id="hint-text"></p>
      </div>
      <section id="screen" hidden></section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
