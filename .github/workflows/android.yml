# Builds the Android app (ADR-0020): an app bundle (.aab) to upload to Google Play, and an APK to
# install on a phone by hand. Run it from the Actions tab, or push a tag such as v1.0.0.
name: Android app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Play needs a higher versionCode for every upload; the run number always grows.
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm test
      - name: Build the game for the app
        run: |
          echo "VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          VITE_APP_VERSION="$(node -p "require('./package.json').version") (${VERSION_CODE}) · $(git rev-parse --short HEAD)" npm run build:app
      - run: npx cap sync android
      # The upload key, from repository secrets. Without them the bundle is built unsigned.
      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build the app bundle and APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew --no-daemon bundleRelease assembleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: atom-trap-neon-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
